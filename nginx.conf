server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must revalidate so new hashed bundles are picked up immediately
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # unsafe-inline needed for framer-motion injected styles
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'none'; object-src 'none'; frame-ancestors 'none';" always;
        # HSTS is intentionally omitted here — set it in Nginx Proxy Manager which handles TLS termination
    }

    # Long-lived cache for hashed assets
    location /assets/ {
        expires 1y;

        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'none'; object-src 'none'; frame-ancestors 'none';" always;
    }

    # Unhashed static files from public/ — cache for a month, not immutable
    location ~* ^/(fonts|images)/|^/noise\.svg$|^/favicon\.svg$ {
        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;
    }
}
